        </div>
        <div class="dt-danger-row">
          <span class="dt-label">${esc(t('action.clear'))}</span>
          <button type="button" class="dt-btn dt-btn-danger" data-act="clear-all">${esc(t('action.clear'))}</button>
        </div>`
  return modalShell(t('action.settings'), body, t('action.save'))
}

/* ------------------------------------------------------------------ */
/* render                                                              */
/* ------------------------------------------------------------------ */

/** Paint the whole page. */
function render() {
  const { dashboard, baseCurrency } = derive()
  const person = view.kind === 'person' ? dashboard.people.find((item) => item.id === view.id) : null
  if (view.kind === 'person' && person === null) view = { kind: 'dashboard', id: null }

  const content = person === null ? dashboardView() : personView(person, baseCurrency)

  let overlay = ''
  if (modal !== null) {
    if (modal.kind === 'person') {
      const record = modal.id === null ? null : runtime.persons.find((item) => item.id === modal.id) ?? null
      overlay = personModal(record)
    } else if (modal.kind === 'loan') {
      const stored = modal.loanId === undefined || modal.loanId === null
        ? null
        : runtime.persons.find((item) => item.id === modal.personId)?.loans?.find((item) => item.id === modal.loanId) ?? null
      overlay = loanModal(modal.personId, stored)
    } else if (modal.kind === 'renew') {
      const previous = dashboard.people.find((item) => item.id === modal.personId)?.loans.find((item) => item.id === modal.loanId)
      overlay = previous ? loanModal(modal.personId, null, previous) : ''
    } else if (modal.kind === 'payment') {
      const stored = runtime.persons.find((item) => item.id === modal.personId)?.loans?.find((item) => item.id === modal.loanId)
      const derived = dashboard.people.find((item) => item.id === modal.personId)?.loans.find((item) => item.id === modal.loanId)
      overlay = derived && stored ? paymentModal(derived, stored) : ''
    } else if (modal.kind === 'settings') {
      overlay = settingsModal()
    }
  }

  app.innerHTML = `
    <div class="dt-root">
      <header class="dt-header">
        <div class="dt-header-main">
          <h1 class="dt-title">${esc(t('app.title'))}</h1>
          <p class="dt-sub">${esc(t('app.subtitle'))} &middot; ${esc(t('app.asOf', { date: formatDate(asOf) }))}</p>
        </div>
        <div class="dt-actions">
          <button type="button" class="dt-btn dt-btn-ghost dt-btn-sm" data-act="toggle-lang" title="Русский / English">${lang === 'ru' ? 'EN' : 'RU'}</button>
          <button type="button" class="dt-btn dt-btn-ghost dt-btn-sm" data-act="settings">${esc(t('action.settings'))}</button>
        </div>
      </header>
      <div class="dt-scroll">${content}</div>
      ${overlay}
    </div>`

  if (modal !== null && (modal.kind === 'loan' || modal.kind === 'renew')) patchLoanPreview()
  if (modal !== null && modal.kind === 'payment') patchPaymentPreview()
  if (modal !== null) {
    const first = app.querySelector('.dt-modal-body input:not([type="hidden"]), .dt-modal-body select')
    if (first) first.focus()
  }
  document.documentElement.lang = lang
}

/** Refresh only the loan preview, so typing keeps the caret. */
function patchLoanPreview() {
  const target = document.getElementById('dt-preview')
  const form = document.getElementById('dt-form')
  if (!target || !form) return
  // The rate input disappears for `none`; re-render the fields only when the
  // rate type changed, which is a click rather than typing.
  target.innerHTML = loanPreview(readLoanForm())
}

/** Refresh only the payment preview. */
function patchPaymentPreview() {
  const target = document.getElementById('dt-preview')
  const form = document.getElementById('dt-form')
  if (!target || !form) return
  if (modal.kind !== 'payment') return
  const stored = runtime.persons.find((item) => item.id === modal.personId)?.loans?.find((item) => item.id === modal.loanId)
  const derived = derive().dashboard.people.find((item) => item.id === modal.personId)?.loans.find((item) => item.id === modal.loanId)
  if (!stored || !derived) return
  const value = (name) => form.querySelector(`[name="${name}"]`)?.value ?? ''
  target.innerHTML = paymentPreview(stored, derived, {
    date: value('date'),
    amount: calc.round2(Number(value('amount')) || 0),
    allocation: value('allocation'),
  })
}

/* ------------------------------------------------------------------ */
/* actions                                                             */
/* ------------------------------------------------------------------ */

/** Show validation messages above the form fields. */
function showErrors(messages) {
  const box = document.getElementById('dt-errors')
  if (!box) return
  box.innerHTML = messages.length === 0 ? '' : `
        <div class="dt-banner dt-banner-warn" style="margin-bottom:12px">
          <span class="dt-banner-grow">${esc(messages.join(' \u00b7 '))}</span>
        </div>`
}

/** Save the open modal. */
function saveModal() {
  const form = document.getElementById('dt-form')
  if (!form) return

  if (modal.kind === 'person') {
    const value = (name) => form.querySelector(`[name="${name}"]`)?.value ?? ''
    const draft = { id: modal.id ?? null, name: value('name').trim(), contact: value('contact').trim(), note: value('note').trim() }
    const validation = calc.validatePerson(draft)
    const clash = runtime.persons.some((item) => item.id !== draft.id && item.name.trim().toLowerCase() === draft.name.toLowerCase())
    const messages = Object.values(validation.errors).map((key) => t(key))
    if (!validation.ok || (clash && draft.name !== '')) {
      if (clash && draft.name !== '') messages.push(t('error.personExists'))
      showErrors(messages)
      return
    }
    if (draft.id === null) {
      const id = newId('person')
      runtime.persons.push({ id, name: draft.name, contact: draft.contact, note: draft.note, loans: [] })
      view = { kind: 'person', id }
    } else {
      const target = runtime.persons.find((item) => item.id === draft.id)
      if (target) Object.assign(target, { name: draft.name, contact: draft.contact, note: draft.note })
    }
    modal = null
    commit()
    return
  }

  if (modal.kind === 'loan') {
    const draft = readLoanForm()
    const validation = calc.validateLoan(draft, { persons: runtime.persons })
    if (!validation.ok) {
      showErrors(Object.values(validation.errors).map((key) => t(key)))
      return
    }
    const record = {
      id: draft.id ?? newId('loan'),
      personId: draft.personId,
      direction: draft.direction,
      principal: calc.round2(Number(draft.principal)),
      currency: String(draft.currency).toUpperCase(),
      startDate: draft.startDate,
      dueDate: draft.dueDate === '' ? null : draft.dueDate,
      rateType: draft.rateType,
      rateValue: draft.rateType === 'none' ? 0 : Number(draft.rateValue) || 0,
      status: draft.status,
      note: draft.note,
      payments: draft.payments ?? [],
    }
    // Moving a loan between people moves it; it must not be copied.
    for (const candidate of runtime.persons) {
      if (candidate.id !== record.personId) candidate.loans = (candidate.loans ?? []).filter((item) => item.id !== record.id)
    }
    const owner = runtime.persons.find((item) => item.id === record.personId)
    if (!owner) return
    owner.loans = owner.loans ?? []
    const index = owner.loans.findIndex((item) => item.id === record.id)
    if (index === -1) owner.loans.push(record)
    else owner.loans[index] = record
    modal = null
    commit()
    return
  }

  if (modal.kind === 'renew') {
    const draft = readLoanForm()
    const validation = calc.validateLoan(draft, { persons: runtime.persons })
    if (!validation.ok) {
      showErrors(Object.values(validation.errors).map((key) => t(key)))
      return
    }
    const owner = runtime.persons.find((item) => item.id === draft.personId)
    const previous = owner?.loans?.find((item) => item.id === draft.renewFromId)
    if (!owner || !previous) return
    // Settle the old loan in full today, then carry its balance into the new one.
    const plan = calc.planRenewal(previous, { asOf, penalty: runtime.penalty })
    if (plan.settlementPayment !== null) {
      previous.payments = [...(previous.payments ?? []), plan.settlementPayment]
    }
    previous.status = 'closed'
    owner.loans.push({
      id: newId('loan'),
      personId: owner.id,
      direction: draft.direction,
      principal: calc.round2(Number(draft.principal)),
      currency: String(draft.currency).toUpperCase(),
      startDate: draft.startDate,
      dueDate: draft.dueDate === '' ? null : draft.dueDate,
      rateType: draft.rateType,
      rateValue: draft.rateType === 'none' ? 0 : Number(draft.rateValue) || 0,
      status: 'active',
      note: draft.note,
      payments: [],
    })
    modal = null
    commit()
    return
  }

  if (modal.kind === 'payment') {
    const value = (name) => form.querySelector(`[name="${name}"]`)?.value ?? ''
    const payment = {
      date: value('date'),
      amount: calc.round2(Number(value('amount')) || 0),
      allocation: value('allocation'),
    }
    const validation = calc.validatePayment(payment)
    if (!validation.ok) {
      showErrors(Object.values(validation.errors).map((key) => t(key)))
      return
    }
    const target = runtime.persons.find((item) => item.id === modal.personId)?.loans?.find((item) => item.id === modal.loanId)
    if (target) {
      target.payments = [...(target.payments ?? []), payment]
      // A payment that clears the loan closes it, so it cannot reopen as the
      // next day's interest accrues.
      const settled = calc.deriveLoan(target, { asOf: payment.date, penalty: runtime.penalty })
      target.status = settled.totalDue <= 0 ? 'closed' : 'active'
    }
    modal = null
    commit()
    return
  }

  if (modal.kind === 'settings') {
    runtime.penalty = {
      enabled: form.querySelector('[name="penaltyEnabled"]').checked,
      annualRate: Math.max(0, Number(form.querySelector('[name="penaltyRate"]').value) || 0),
    }
    modal = null
    commit()
  }
}

/**
 * Handle a click on the delegated `data-act` surface.
 * @param event - the click event.
 */
function onClick(event) {
  const target = event.target.closest('[data-act]')
  if (target === null) return
  const act = target.dataset.act
  const personId = target.dataset.person
  const loanId = target.dataset.loan

  if (act === 'toggle-lang') {
    lang = lang === 'ru' ? 'en' : 'ru'
    render()
    return
  }
  if (act === 'open-person') {
    view = { kind: 'person', id: personId }
    render()
    return
  }
  if (act === 'back') {
    view = { kind: 'dashboard', id: null }
    render()
    return
  }
  if (act === 'add-person') { modal = { kind: 'person', id: null }; render(); return }
  if (act === 'edit-person') { modal = { kind: 'person', id: personId }; render(); return }
  if (act === 'add-loan') { modal = { kind: 'loan', personId: personId ?? runtime.persons[0]?.id, loanId: null }; render(); return }
  if (act === 'edit-loan') { modal = { kind: 'loan', personId, loanId }; render(); return }
  if (act === 'renew-loan') { modal = { kind: 'renew', personId, loanId }; render(); return }
  if (act === 'add-payment') { modal = { kind: 'payment', personId, loanId }; render(); return }
  if (act === 'settings') { modal = { kind: 'settings' }; render(); return }
  if (act === 'close-modal' || (act === 'overlay' && event.target === target)) {
    modal = null
    render()
    return
  }
  if (act === 'save') { saveModal(); return }
  if (act === 'delete-person') {
    const person = runtime.persons.find((item) => item.id === personId)
    if (!window.confirm(t('confirm.deletePerson', { name: person?.name ?? '' }))) return
    runtime.persons = runtime.persons.filter((item) => item.id !== personId)
    view = { kind: 'dashboard', id: null }
    commit()
    return
  }
  if (act === 'delete-loan') {
    if (!window.confirm(t('confirm.deleteLoan'))) return
    const owner = runtime.persons.find((item) => item.id === personId)
    if (owner) owner.loans = (owner.loans ?? []).filter((item) => item.id !== loanId)
    commit()
    return
  }
  if (act === 'delete-payment') {
    if (!window.confirm(t('confirm.deletePayment'))) return
    const owner = runtime.persons.find((item) => item.id === personId)
    const loan = owner?.loans?.find((item) => item.id === loanId)
    const index = Number(target.dataset.index)
    if (loan && Number.isInteger(index) && index >= 0 && index < (loan.payments ?? []).length) {
      loan.payments.splice(index, 1)
      commit()
    }
    return
  }
  if (act === 'toggle-loan') {
    const derived = derive().dashboard.people.find((item) => item.id === personId)?.loans.find((item) => item.id === loanId)
    const targetLoan = runtime.persons.find((item) => item.id === personId)?.loans?.find((item) => item.id === loanId)
    if (derived && targetLoan) {
      targetLoan.status = derived.isSettledByStored ? 'active' : 'closed'
      commit()
    }
    return
  }
  if (act === 'load-demo') {
    if (runtime.persons.length > 0 && !window.confirm(t('confirm.loadDemo'))) return
    runtime = { ...calc.createSeed(asOf), demo: true }
    view = { kind: 'dashboard', id: null }
    commit()
    return
  }
  if (act === 'keep-demo') { runtime.demo = false; commit(); return }
  if (act === 'clear-all') {
    if (!window.confirm(t('confirm.clear'))) return
    runtime.persons = []
    runtime.demo = false
    modal = null
    view = { kind: 'dashboard', id: null }
    commit()
  }
}

/**
 * Show or hide the rate field and relabel it for the chosen rate type, without
 * repainting the form (a repaint would discard what the user has typed).
 * @param rateType - the newly selected rate type.
 */
function syncRateField(rateType) {
  const fieldElement = document.getElementById('dt-rate-field')
  const labelElement = document.getElementById('dt-rate-label')
  if (fieldElement) fieldElement.hidden = rateType === 'none'
  if (labelElement) labelElement.textContent = rateType === 'fixed' ? t('rateValue.amount') : t('field.rateValue')
}

/**
 * Handle a click on a segmented option.
 * @param event - the click event.
 */
function onFormClick(event) {
  const segment = event.target.closest('[data-seg]')
  if (segment === null) return
  const name = segment.dataset.seg
  const form = document.getElementById('dt-form')
  const input = form?.querySelector(`[name="${name}"]`)
  if (input) input.value = segment.dataset.value
  for (const option of segment.parentElement.querySelectorAll('[data-seg]')) {
    option.setAttribute('aria-pressed', String(option === segment))
  }
  if (name === 'rateType') syncRateField(segment.dataset.value)
  if (modal?.kind === 'loan') patchLoanPreview()
  if (modal?.kind === 'payment') patchPaymentPreview()
}

/** Wire the page once; everything else is delegated. */
window.addEventListener('keydown', (event) => {
  if (event.key === 'Escape' && modal !== null) {
    modal = null
    render()
  }
})
app.addEventListener('click', (event) => { onFormClick(event); onClick(event) })
app.addEventListener('input', () => {
  if (modal === null) return
  if (modal.kind === 'loan' || modal.kind === 'renew') patchLoanPreview()
  if (modal.kind === 'payment') patchPaymentPreview()
})
app.addEventListener('change', () => {
  if (modal === null) return
  if (modal.kind === 'loan' || modal.kind === 'renew') patchLoanPreview()
  if (modal.kind === 'payment') patchPaymentPreview()
})

saveState()
render()

// Installability: register the offline worker wherever the platform allows it.
// Without it the app still runs; the worker only makes it launch offline and
// keeps the phone from showing a blank page on a cold start with no network.
if (typeof navigator !== 'undefined'
  && 'serviceWorker' in navigator
  && typeof location !== 'undefined'
  && location.protocol === 'https:') {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js').catch(() => {
      // An unsupported or blocked worker is not an error the user can act on.
    })
  })
}
})()
</script>
</body>
